<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#09131f" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)" />

  <!-- Tactical Grid -->
  <rect width="256" height="256" fill="url(#grid)" opacity="0.8" />
  
  <!-- Major Grid Lines -->
  <line x1="64" y1="0" x2="64" y2="256" stroke="#334155" stroke-width="1" opacity="0.4" />
  <line x1="128" y1="0" x2="128" y2="256" stroke="#334155" stroke-width="1" opacity="0.4" />
  <line x1="192" y1="0" x2="192" y2="256" stroke="#334155" stroke-width="1" opacity="0.4" />
  <line x1="0" y1="64" x2="256" y2="64" stroke="#334155" stroke-width="1" opacity="0.4" />
  <line x1="0" y1="128" x2="256" y2="128" stroke="#334155" stroke-width="1" opacity="0.4" />
  <line x1="0" y1="192" x2="256" y2="192" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- Contour Lines (Topographic Curves) -->
  <!-- Level 1 - Outer (cyan / teal low opacity) -->
  <path d="M-10,210 C40,200 70,240 130,225 C190,210 215,245 270,230" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.4" />
  <path d="M-10,185 C35,170 85,210 140,195 C195,180 220,215 270,200" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.45" />
  <path d="M-10,160 C30,145 90,180 150,165 C200,150 230,185 270,170" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.5" />
  
  <!-- Level 2 - Intermediate Index Contour (Bright Teal) -->
  <path d="M-10,135 C30,115 100,150 160,135 C210,120 235,155 270,140" fill="none" stroke="#06b6d4" stroke-width="1.6" opacity="0.75" />
  
  <!-- Level 3 - Hill contours -->
  <path d="M-10,110 C25,90 105,125 170,105 C215,90 240,125 270,110" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.55" />
  <path d="M-10,85 C20,65 110,95 175,75 C220,60 245,95 270,80" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.6" />
  
  <!-- Level 4 - Upper Ridge Index Contour -->
  <path d="M-10,60 C25,40 115,70 180,50 C225,35 250,65 270,50" fill="none" stroke="#06b6d4" stroke-width="1.6" opacity="0.85" />
  <path d="M-10,35 C30,18 120,40 185,25 C230,12 255,38 270,25" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.6" />

  <!-- Concentric Hill / Peak on Right -->
  <ellipse cx="205" cy="85" rx="36" ry="24" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.5" transform="rotate(-15 205 85)" />
  <ellipse cx="205" cy="85" rx="26" ry="17" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.8" transform="rotate(-15 205 85)" />
  <ellipse cx="205" cy="85" rx="15" ry="10" fill="none" stroke="#10b981" stroke-width="1.3" opacity="0.9" transform="rotate(-15 205 85)" />
  <circle cx="205" cy="85" r="2.5" fill="#34d399" />

  <!-- Mountain Peak on Left -->
  <ellipse cx="65" cy="145" rx="42" ry="28" fill="none" stroke="#0ea5e9" stroke-width="0.9" opacity="0.5" transform="rotate(10 65 145)" />
  <ellipse cx="65" cy="145" rx="30" ry="20" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.8" transform="rotate(10 65 145)" />
  <ellipse cx="65" cy="145" rx="18" ry="12" fill="none" stroke="#10b981" stroke-width="1.3" opacity="0.9" transform="rotate(10 65 145)" />
  <polygon points="65,140 68,146 62,146" fill="#38bdf8" />

  <!-- Tactical Labels -->
  <text x="14" y="24" fill="#38bdf8" font-size="9" font-family="monospace" font-weight="700" letter-spacing="0.5">TAKTIS / OFFLINE</text>
  <text x="14" y="244" fill="#64748b" font-size="8" font-family="monospace">GRID 100m • CONTOUR 25m</text>
  <text x="72" y="146" fill="#38bdf8" font-size="7.5" font-family="monospace">▲ 1420m</text>
  <text x="195" y="68" fill="#34d399" font-size="7" font-family="monospace">1350m</text>
  <text x="122" y="132" fill="#06b6d4" font-size="6.5" font-family="monospace" opacity="0.85">1200</text>
</svg>
